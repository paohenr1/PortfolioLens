name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
        env:
          POSTGRES_DB: stock_research_ci
          POSTGRES_USER: postgres
          # Synthetic credential for this disposable CI service, never production.
          POSTGRES_PASSWORD: ci-only-disposable-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stock_research_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_ENV: development
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
      DJANGO_DATABASE_ENGINE: postgresql
      DJANGO_DATABASE_NAME: stock_research_ci
      DJANGO_DATABASE_USER: postgres
      DJANGO_DATABASE_PASSWORD: ci-only-disposable-database-password
      DJANGO_DATABASE_HOST: 127.0.0.1
      DJANGO_DATABASE_PORT: '5432'
      DJANGO_DATABASE_SSLMODE: disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the pinned environment tool
        run: python -m pip install uv==0.12.19
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Lint and formatting
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
      - name: Framework and migration checks
        run: |
          uv run --frozen python manage.py check
          uv run --frozen python manage.py makemigrations --check --dry-run
      - name: Production configuration guards (synthetic, no remote services)
        run: uv run --frozen python scripts/check_release_configuration.py
      - name: Production serving smoke (synthetic, no remote services)
        run: uv run --frozen python tests/production_smoke.py
      - name: Unit and integration tests
        run: uv run --frozen python manage.py test --verbosity 2
      - name: SQLite foundation compatibility
        env:
          DJANGO_DATABASE_ENGINE: sqlite
          DJANGO_DATABASE_NAME: ''
          DJANGO_DATABASE_USER: ''
          DJANGO_DATABASE_PASSWORD: ''
          DJANGO_DATABASE_HOST: ''
          DJANGO_DATABASE_PORT: ''
          DJANGO_DATABASE_SSLMODE: ''
          DJANGO_DATABASE_SSLROOTCERT: ''
        run: uv run --frozen python manage.py test --verbosity 2
      - name: Verify static asset collection
        run: uv run --frozen python manage.py collectstatic --noinput
