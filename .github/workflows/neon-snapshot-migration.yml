name: Manual Neon snapshot migration

# Intentionally no push, pull_request, or scheduled trigger.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run plan first; apply only after reviewing its output."
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan
      approval:
        description: "For apply, enter APPLY_PORTFOLIOLENS_0002"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: neon-production-snapshot-migration-0002
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # These are separate repository Actions secrets, not the Render environment.
      DJANGO_DATABASE_HOST: ${{ secrets.NEON_DB_HOST }}
      DJANGO_DATABASE_NAME: ${{ secrets.NEON_DB_NAME }}
      DJANGO_DATABASE_USER: ${{ secrets.NEON_DB_USER }}
      DJANGO_DATABASE_PASSWORD: ${{ secrets.NEON_DB_PASSWORD }}
      DJANGO_DATABASE_PORT: "5432"
      DJANGO_DATABASE_SSLMODE: verify-full
      DJANGO_DATABASE_SSLROOTCERT: /etc/ssl/certs/ca-certificates.crt
      DJANGO_DATABASE_ENGINE: postgresql
      DJANGO_ENV: production
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost
      DJANGO_RATE_LIMIT_BACKEND: postgresql
      DJANGO_PRIVATE_SITE: "true"
      DJANGO_ALLOW_REGISTRATION: "false"
    steps:
      - name: Require main and explicit apply approval
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          APPROVAL_TEXT: ${{ inputs.approval }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Run this workflow from main only."
            exit 1
          fi
          if [[ "$REQUESTED_MODE" != "plan" && "$REQUESTED_MODE" != "apply" ]]; then
            echo "::error::Unsupported mode."
            exit 1
          fi
          if [[ "$REQUESTED_MODE" == "apply" && "$APPROVAL_TEXT" != "APPLY_PORTFOLIOLENS_0002" ]]; then
            echo "::error::Apply requires the exact confirmation phrase."
            exit 1
          fi

      - name: Check Neon connection secret configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in DJANGO_DATABASE_HOST DJANGO_DATABASE_NAME DJANGO_DATABASE_USER DJANGO_DATABASE_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required Actions secret for $name is missing."
              exit 1
            fi
          done
          if [[ "$DJANGO_DATABASE_HOST" != *.neon.tech || "$DJANGO_DATABASE_HOST" == *-pooler* ]]; then
            echo "::error::Use the production Neon's direct endpoint, not a pooler or another provider."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Generate an ephemeral Django startup key
        shell: bash
        run: |
          python - <<'PY'
          import os
          import secrets

          # This key is only for migration startup; it never replaces Render's key.
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("DJANGO_SECRET_KEY=" + secrets.token_urlsafe(64) + "\n")
          PY

      - name: Install locked runtime dependencies
        shell: bash
        run: |
          python -m pip install uv==0.12.19
          uv sync --frozen --no-dev

      - name: Refuse any unexpected pending migrations
        shell: bash
        run: |
          uv run --frozen --no-dev python - <<'PY'
          import django

          django.setup()

          from django.db import connection
          from django.db.migrations.executor import MigrationExecutor

          expected = ("portfolios", "0002_holdingssnapshot_snapshotholding_snapshotsubmission_and_more")
          executor = MigrationExecutor(connection)
          if expected not in executor.loader.graph.nodes:
              raise SystemExit("The expected snapshot migration is absent from this checkout.")
          pending = executor.migration_plan(executor.loader.graph.leaf_nodes())
          if any(reverse for _, reverse in pending):
              raise SystemExit("Unexpected reverse migration requested.")
          names = [(migration.app_label, migration.name) for migration, _ in pending]
          if names not in ([], [expected]):
              print("Pending migration identifiers:", [f"{app}.{name}" for app, name in names])
              raise SystemExit("Unexpected migrations are pending; no changes will be applied.")
          print("Migration scope verified: only portfolios 0002 is pending, or already applied.")
          PY

      - name: Display the migration plan (read only)
        shell: bash
        run: uv run --frozen --no-dev python manage.py migrate --plan

      - name: Apply only portfolios snapshot migration 0002
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          uv run --frozen --no-dev python manage.py migrate portfolios 0002_holdingssnapshot_snapshotholding_snapshotsubmission_and_more --noinput
          uv run --frozen --no-dev python manage.py showmigrations portfolios
