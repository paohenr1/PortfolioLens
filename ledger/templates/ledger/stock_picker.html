<section class="stock-picker" hidden data-search-url="{% url 'ledger_instrument_search' portfolio.pk %}" data-held-url="{% url 'ledger_held_instruments' portfolio.pk %}" aria-labelledby="stock-picker-title">
<h2 id="stock-picker-title">Choose a stock</h2><label for="stock-query">Ticker or company name</label><div class="stock-search-controls"><input id="stock-query" aria-controls="stock-results" aria-describedby="stock-selection" name="instrument_query" type="search" maxlength="100" autocomplete="off" value="{{ request.POST.instrument_query }}" placeholder="e.g. AAPL or Apple"><button type="button" class="button" id="stock-search">Search</button></div>
<p id="stock-selection" role="status" aria-live="polite"></p><div id="stock-results" class="stock-results" aria-label="Matching stocks"></div>{{ form.security_id.errors }}</section>
