[project]
name = "stock-research-platform"
version = "0.31.0"
description = "A Python-first stock research and portfolio analytics platform."
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django>=5.2,<5.3",
    "exchange-calendars>=4.13,<4.14",
    "gunicorn>=26.2,<27",
    "httpx>=0.28,<0.29",
    "psycopg[binary]>=3.2,<3.3",
    "whitenoise>=6.12,<7",
]

[dependency-groups]
dev = ["ruff>=0.15,<0.16"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
