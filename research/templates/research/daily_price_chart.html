        <figure class="chart-figure">
          <div class="chart-scroll" tabindex="0" aria-label="Scrollable price chart">
            <svg class="price-chart" viewBox="0 0 900 340" role="img" aria-labelledby="chart-title chart-description">
              <title id="chart-title">{{ chart.basis_label }} from {{ history.start_date|date:"Y-m-d" }} to {{ history.end_date|date:"Y-m-d" }}</title>
              <desc id="chart-description">{{ chart.points|length }} completed daily closes. Horizontal positions use calendar dates. The vertical axis is scaled to the plotted values. Exact values appear in the observations table below.</desc>
              {% for y, label in chart.y_ticks %}<line class="chart-grid" x1="95" x2="875" y1="{{ y }}" y2="{{ y }}"/><text class="chart-axis" x="85" y="{{ y }}" text-anchor="end" dominant-baseline="middle">{{ label }}</text>{% endfor %}
              <text class="chart-axis" x="95" y="320">{{ history.start_date|date:"Y-m-d" }}</text>
              <text class="chart-axis" x="875" y="320" text-anchor="end">{{ history.end_date|date:"Y-m-d" }}</text>
              {% for path in chart.paths %}<path class="chart-line" d="{{ path }}"/>{% endfor %}
              {% for point in chart.points %}<circle class="chart-point" cx="{{ point.x }}" cy="{{ point.y }}" r="3" data-label="{{ point.date|date:'Y-m-d' }}: {{ point.value }}{% if history.security.currency %} {{ history.security.currency }}{% endif %}"><title>{{ point.date|date:"Y-m-d" }}: {{ point.value }}{% if history.security.currency %} {{ history.security.currency }}{% endif %}</title></circle>{% endfor %}
            </svg>
          </div>
          <figcaption>Hover or tap the chart to inspect a plotted observation. On small screens, scroll horizontally. Use the table for keyboard access to exact values.</figcaption>
          <p class="chart-readout" aria-live="polite">{{ chart.basis_label }} · {{ chart.points|length }} plotted observations</p>
        </figure>
