  <header class="market-header">
    <a class="market-brand" href="{% if is_preview %}{% url 'markets_preview' %}{% else %}{% url 'home' %}{% endif %}" aria-label="PortfolioLens markets"><span class="brand-symbol" aria-hidden="true"></span>PortfolioLens</a>
    <nav class="market-nav" aria-label="Main navigation">
      <a class="is-active" href="{% if is_preview %}{% url 'markets_preview' %}{% else %}{% url 'home' %}{% endif %}" aria-current="page">Markets</a>
      <a href="{% url 'portfolio_list' %}">My Portfolio</a>
      <a href="{% url 'search' %}">Research</a>
      <a href="{% url 'watchlist_list' %}">Watchlists</a>
    </nav>
    <form class="header-search" action="{% url 'search' %}" method="get" role="search">
      <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m16 16 5 5" stroke="currentColor" stroke-width="1.5"/></svg>
      <label class="sr-only" for="market-search">Search stocks or companies</label>
      <input id="market-search" name="q" type="search" placeholder="Search stocks or companies…" maxlength="100" required>
      <button class="sr-only" type="submit">Search</button>
    </form>
    <div class="header-tools">
      <label class="sr-only" for="theme-select">Color theme</label>
      <select id="theme-select" class="theme-select" aria-label="Color theme"><option value="dark">Dark</option><option value="light">Light</option></select>
      {% if user.is_authenticated %}
      <details class="account-menu"><summary class="account-link" aria-label="Account menu"><svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></summary><div class="account-menu-panel"><a href="{% url 'account' %}">My account</a><form action="{% url 'sign_out' %}" method="post">{% csrf_token %}<button type="submit">Sign out</button></form></div></details>
      {% else %}
      <a class="account-link" href="{% url 'sign_in' %}" aria-label="Sign in"><svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></a>
      {% endif %}
    </div>
  </header>
