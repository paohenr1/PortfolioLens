{% load static %}
<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A workspace for stock research and portfolio analytics.">
    <title>{% block title %}PortfolioLens · Portfolio Analytics{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'research/header.css' %}">
    <link rel="stylesheet" href="{% static 'research/theme.css' %}">
    <script src="{% static 'research/theme.js' %}"></script>
    <link rel="stylesheet" href="{% static 'research/site.css' %}">
    {% block extra_head %}{% endblock %}
  </head>
  <body class="{% block body_class %}{% endblock %}">
    <a class="skip-link" href="#main">Skip to content</a>
    {% include 'research/site_header.html' %}
    <main id="main" tabindex="-1">{% block content %}{% endblock %}</main>
    <footer>PortfolioLens <span>Research tools · No trading execution</span></footer>
  </body>
</html>
